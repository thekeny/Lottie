<!doctype html>
<html lang="ru" data-type="software">
<head>

  <meta name="description" content="Знакомься, Лотти. Маленький аксолотль, большой характер и целая орбита эмоций.">
  <meta name="page-type" content="software"><meta name="site-kind" content="software">
  <meta property="og:title" content="Лотти. Весь спектр эмоций.">
  <meta property="og:description" content="История, характер и целая орбита эмоций любопытного аксолотля.">
  <meta property="og:type" content="website"><meta property="og:image" content="images/lotti_02.png">
  <title>Лотти.</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="preload" href="fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#hello">К содержанию</a>
  <header class="site-header">
    <a class="wordmark" href="#hello" aria-label="Лотти — в начало"><img src="images/emoji_07.png" width="1300" height="675" alt="">лотти.</a>
  </header>
  <main id="main">
    <section class="slide hello is-active" id="hello" aria-labelledby="hello-title">
      <div class="hero-type"><h1 id="hello-title" tabindex="-1" aria-label="LOTTIE"><span aria-hidden="true" style="--letter:0">L</span><span aria-hidden="true" style="--letter:1">O</span><span aria-hidden="true" style="--letter:2">T</span><span aria-hidden="true" style="--letter:3">T</span><span aria-hidden="true" style="--letter:4">I</span><span aria-hidden="true" style="--letter:5">E</span></h1></div>
      <div class="hero-art"><img class="sprite" src="images/lotti_02.png" width="1253" height="1514" alt="Лотти машет голубым флажком"></div>
      <p class="hero-caption" lang="en">the axolotl</p>
    </section>
    <section class="slide evolution" id="evolution" aria-labelledby="evolution-title">
      <h2 id="evolution-title">Новая форма.<br><span>Тот же Лотти.</span></h2>
      <div class="evolution-stage">
        <img class="evolution-old" src="images/lottie_old.png" width="1435" height="2174" alt="Старый Лотти — белый аксолотль с плавными линиями">
        <svg class="evolution-arrow" viewBox="0 0 80 48" aria-hidden="true" focusable="false"><path fill="currentColor" d="M48 0h8v8h8v8h8v8h8v8h-8v8h-8v8H48v-8h8v-8H0v-8h56v-8h-8z"/></svg>
        <img class="evolution-new sprite" src="images/lotti_01.png" width="780" height="1260" alt="Новый Лотти — белый аксолотль в пиксельном стиле">
      </div>
    </section>
    <section class="slide character" id="character" aria-labelledby="character-title">
      <h2 id="character-title">Маленький.<br>С характером.</h2>
      <img class="pixel-object character-bulb" src="images/pixel-bulb.png" width="957" height="820" alt="" aria-hidden="true">
      <div class="character-cast">
        <div class="cast-member"><img class="sprite" src="images/lotti_03.png" width="1251" height="1383" alt="Лотти в наушниках"></div>
        <div class="cast-member"><img class="sprite" src="images/lotti_01.png" width="780" height="1260" alt="Добродушный Лотти"></div>
        <div class="cast-member"><img class="sprite" src="images/lotti_04.png" width="840" height="1305" alt="Лотти с медалью"></div>
      </div>
    </section>
    <section class="slide rhythm" id="puzzle" aria-labelledby="rhythm-title">
      <h2 id="rhythm-title">На своей<br><span class="rhythm-title-line">волне. <img class="pixel-object rhythm-note" src="images/pixel-lightning.png" width="1859" height="820" alt="" aria-hidden="true"></span></h2>
      <div class="sound-rings" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="rhythm-art"><img class="sprite" src="images/lotti_03.png" width="1251" height="1383" alt="Лотти в наушниках покачивается в ритм"></div>
      <div class="equalizer" aria-hidden="true"><i style="--beat:0"></i><i style="--beat:1"></i><i style="--beat:2"></i><i style="--beat:3"></i><i style="--beat:4"></i><i style="--beat:5"></i><i style="--beat:6"></i><i style="--beat:7"></i><i style="--beat:8"></i><i style="--beat:9"></i><i style="--beat:10"></i><i style="--beat:11"></i><i style="--beat:12"></i><i style="--beat:13"></i><i style="--beat:14"></i><i style="--beat:15"></i><i style="--beat:16"></i></div>
    </section>
    <section class="slide pasta" id="pasta" aria-labelledby="pasta-title">
      <h2 id="pasta-title"><span>Любит <img class="pixel-object pasta-heart" src="images/pixel-heart.png" width="957" height="820" alt="" aria-hidden="true"></span>Макарошки<br>по-PRODски.</h2>
      <div class="pasta-scene">
        <img class="pasta-mascot sprite" src="images/lottie_05.png" width="1086" height="1448" alt="Лотти ест любимые макарошки">
      </div>
    </section>
    <section class="slide moods" id="moods" aria-labelledby="moods-title">
      <div class="emotion-universe" id="emotion-universe">
        <div class="orbit-guide" aria-hidden="true"></div>
        <div class="emotion-orbit" aria-hidden="true">
          <div class="orbit-slot" style="--angle:0deg;--order:0"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_01.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:30deg;--order:1"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_02.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:60deg;--order:2"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_03.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:90deg;--order:3"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_04.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:120deg;--order:4"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_05.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:150deg;--order:5"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_06.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:180deg;--order:6"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_07.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:210deg;--order:7"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_08.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:240deg;--order:8"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_09.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:270deg;--order:9"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_10.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:300deg;--order:10"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_11.png" width="1300" height="675" alt=""></div></div></div>
          <div class="orbit-slot" style="--angle:330deg;--order:11"><div class="orbit-position"><div class="orbit-upright"><img src="images/emoji_12.png" width="1300" height="675" alt=""></div></div></div>
        </div>
        <img class="emotion-central sprite" id="emotion-central" src="images/emoji_01.png" width="1300" height="675" alt="Двенадцать выражений Лотти сменяются и собираются в круг">
        <div class="emotion-title">
          <h2 id="moods-title">Чувствовать.<br>Всё.</h2>
          <div class="mood-memory"><div class="mood-memory-date"><img class="pixel-object" src="images/pixel-clock.png" width="957" height="820" alt=""><time datetime="2025-11-23">23.11.2025</time></div><p>Москва, ЦУ</p></div>
        </div>
      </div>

      <noscript><style>.emotion-central{display:none}.emotion-title{opacity:1}.orbit-position{transform:translate(-50%,-50%) translateX(var(--radius)) scale(1);opacity:1}.emotion-orbit,.orbit-upright{animation:none}</style></noscript>
    </section>
    <section class="slide finale" id="curiosity" aria-labelledby="finale-title">
      <div class="finale-copy">
        <h2 id="finale-title">Большие дела<br>начинаются<br><span>с малого.</span></h2>
        <a class="prod-button" href="https://prodcontest.com" target="_blank" rel="noopener noreferrer">Вкатиться на PROD <span aria-hidden="true">↗</span></a>
      </div>
      <div class="finale-art"><img class="sprite" src="images/lotti_04.png" width="840" height="1305" alt="Лотти готов к новым открытиям"><img class="trophy sprite" src="images/pixel-trophy.png" width="1012" height="820" alt="Пиксельный кубок"></div>
    </section>
    <section class="slide spin-slide" id="spin" aria-label="Лотти вращается" tabindex="-1">
      <img src="images/lottie_spin.webp" width="1024" height="1024" alt="Вращающийся плюшевый Лотти">
    </section>
  </main>

  <nav class="chapter-nav" aria-label="Слайды"><a href="#hello" aria-label="Знакомство" aria-current="location"><span></span></a><a href="#evolution" aria-label="Из старого Лотти в пиксельного"><span></span></a><a href="#character" aria-label="Характер"><span></span></a><a href="#puzzle" aria-label="На своей волне"><span></span></a><a href="#pasta" aria-label="Макарошки по-PRODски"><span></span></a><a href="#moods" aria-label="Чувствовать всё — 23.11.2025, Москва, ЦУ"><span></span></a><a href="#curiosity" aria-label="Большие дела"><span></span></a></nav>

</html>
